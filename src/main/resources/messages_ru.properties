start.alreadySetup=Бот уже настроен.\n\nОтправьте /menu, чтобы увидеть доступные действия.
start.welcome=Добро пожаловать в Fitness Bot.\n\nСамый простой сценарий:\n1. Создайте программу или откройте сохранённую.\n2. Отправьте дни сообщениями или загрузите Excel-файл, где каждый лист — отдельный день.\n3. Откройте /active_day, когда будете готовы тренироваться.\n\nВыберите действие ниже.

help.how.title=Как это работает
help.how.step1=1. Создайте программу через <code>/create_program &lt;название&gt;</code> или меню.
help.how.step2=2. Отправьте каждый тренировочный день сообщением или загрузите Excel-файл, где каждый лист — отдельный день.
help.how.step3=3. Завершите программу и открывайте её через <code>/show_program</code>.
help.format.title=Формат, который я понимаю
help.format.sections=• Заголовки блоков с <code>:</code>
help.format.exercises=• Упражнения строками с <code>-</code> или <code>⁃</code>
help.format.sets=• Подходы и повторы вроде <code>3 x 10</code>
help.format.videos=• Ссылки на видео отдельной строкой
help.commands.title=Команды
help.command.examplePrefix=  Пример: 
help.example.title=Пример сообщения
help.example=<pre>Верх тела:\n- Жим лёжа 3 x 10\n- Подтягивания 3 x 8\n- https://youtube.com/watch?v=example</pre>
help.footer=Введите <code>/</code>, чтобы увидеть команды, или <code>/menu</code>, чтобы вернуться в меню.

