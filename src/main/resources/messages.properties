start.alreadySetup=You're already set up.\n\nSend /menu to see what you can do next.
start.welcome=Welcome to Fitness Bot.\n\nHere is the easiest way to use it:\n1. Create a program or open a saved one.\n2. Send training days as messages, or upload an Excel file with one sheet per day.\n3. Open /active_day when you're ready to train.\n\nChoose an option below to get started.

help.how.title=How it works
help.how.step1=1. Start a program with <code>/create_program &lt;name&gt;</code> or use the menu.
help.how.step2=2. Send each training day as a message, or upload an Excel file with one sheet per day.
help.how.step3=3. Finish the program, then open it any time from <code>/show_program</code>.
help.format.title=Message format I can read
help.format.sections=• Section headers ending with <code>:</code>
help.format.exercises=• Exercise lines starting with <code>-</code> or <code>⁃</code>
help.format.sets=• Sets and reps like <code>3 x 10</code>
help.format.videos=• Video links on separate lines
help.commands.title=Commands
help.command.examplePrefix=  Example: 
help.example.title=Example message
help.example=<pre>Upper Body:\n- Bench Press 3 x 10\n- Pull-Ups 3 x 8\n- https://youtube.com/watch?v=example</pre>
help.footer=Type <code>/</code> to see all available commands, or use <code>/menu</code> to return to the main actions.

