# PostgreSQL Database Configuration
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/fitness_bot}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Liquibase Configuration
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # Redis Configuration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${SPRING_REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${SPRING_REDIS_PORT:6379}}

# Server Configuration
server:
  port: ${SERVER_PORT:8080}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,conditions,mappings,startup
  endpoint:
    health:
      show-details: always

# Telegram Bot Configuration
telegram:
  bot:
    username: ${TELEGRAM_BOT_USERNAME:zil_fit_bot}

openai:
  api-key: ${OPENAI_API_KEY:${NEBIUS_API_KEY:}}
  base-url: ${OPENAI_BASE_URL:${NEBIUS_BASE_URL:https://api.tokenfactory.nebius.com/v1/}}
  model: ${OPENAI_MODEL:${NEBIUS_MODEL:openai/gpt-oss-120b-fast}}

admin:
  auth:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:change-me}
