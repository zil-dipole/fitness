databaseChangeLog:
  - changeSet:
      id: 007-add-active-program-fields
      author: developer
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: active_program_id
                  type: BIGINT
              - column:
                  name: active_training_day_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: active_program_id
            referencedTableName: programs
            referencedColumnNames: id
            constraintName: fk_users_active_program
            onDelete: SET NULL
        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: active_training_day_id
            referencedTableName: training_days
            referencedColumnNames: id
            constraintName: fk_users_active_training_day
            onDelete: SET NULL
